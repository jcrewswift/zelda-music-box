<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Legend of Zelda - Royal Music Box</title>
    <style>
        body {
            background-color: #0c1017;
            color: #d1d5db;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .container {
            background: #18202e;
            border: 3px solid #f3ba2f;
            border-radius: 12px;
            padding: 22px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 0 25px rgba(243, 186, 47, 0.25);
            text-align: center;
        }
        h2 {
            color: #f3ba2f;
            font-size: 1.25rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(243, 186, 47, 0.4);
        }
        .subtitle {
            color: #60a5fa;
            font-size: 0.85rem;
            font-style: italic;
            margin-bottom: 15px;
        }
        .directive {
            background: #111827;
            border-left: 4px solid #f3ba2f;
            padding: 10px;
            font-size: 0.82rem;
            text-align: left;
            margin-bottom: 20px;
            color: #9ca3af;
            font-family: 'Courier New', Courier, monospace;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            background: #1f293d;
            color: #f3ba2f;
            border: 2px solid #f3ba2f;
            padding: 12px 5px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Courier New', Courier, monospace;
        }
        button:active, button.active {
            background: #f3ba2f;
            color: #0c1017;
            box-shadow: 0 0 12px #f3ba2f;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        #play-btn {
            background: #059669;
            color: #ffffff;
            border: none;
        }
        #reset-btn {
            background: #dc2626;
            color: #ffffff;
            border: none;
        }
        select {
            width: 100%;
            background: #111827;
            color: #f3ba2f;
            border: 2px solid #f3ba2f;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
        }
        #result-box {
            margin-top: 15px;
            padding: 10px;
            font-size: 0.88rem;
            font-weight: bold;
            display: none;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>▲ TRIFORCE MUSIC BOX CIPHER ▲</h2>
    <div class="subtitle">"Play the sacred notes of the Royal Family..."</div>
    
    <div class="directive">
        <strong>Scroll Directive:</strong> Listen to the music box mechanism or test the tone cylinders. Input the correct royal 6-note sequence, then select the matching melody from the archive dropdown to unlock the hidden coordinates.
    </div>

    <div class="grid">
        <button onclick="pressNote(1)" id="note-1">NOTE 1</button>
        <button onclick="pressNote(2)" id="note-2">NOTE 2</button>
        <button onclick="pressNote(3)" id="note-3">NOTE 3</button>
        <button onclick="pressNote(4)" id="note-4">NOTE 4</button>
        <button onclick="pressNote(5)" id="note-5">NOTE 5</button>
        <button onclick="pressNote(6)" id="note-6">NOTE 6</button>
    </div>

    <button class="action-btn" id="play-btn" onclick="playCylinderMelody()">▶ PLAY CYLINDER MELODY</button>
    <button class="action-btn" id="reset-btn" onclick="resetCipher()">↺ RESET CYLINDER</button>

    <select id="melody-select" onchange="checkDropdown(this.value)">
        <option value="">-- Select Hyrule Melody Match --</option>
        <option value="saria">Saria's Song</option>
        <option value="lullaby">Zelda's Lullaby</option>
        <option value="storm">Song of Storms</option>
        <option value="time">Song of Time</option>
    </select>

    <div id="result-box"></div>
</div>

<script>
    // ==========================================
    // UPDATE YOUR COORDINATES HERE TOMORROW:
    // ==========================================
    const FINAL_COORDINATES = "N 30° [Pending Field Check] W 095° [Pending Field Check]";

    // Frequencies mapped across the 6 buttons (Note 1 to 6)
    const noteFrequencies = {
        1: 329.63, // E4
        2: 392.00, // G4
        3: 440.00, // A4
        4: 493.88, // B4
        5: 587.33, // D5
        6: 880.00  // A5 (High A)
    };

    // Zelda's Lullaby exact sequence using the buttons: Note 4 (B4), Note 5 (D5), Note 6 (A5), Note 4, Note 5, Note 6
    const correctSequence = [4, 5, 6, 4, 5, 6];
    let userSequence = [];

    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playTone(frequency, duration = 350) {
        initAudio();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.value = frequency;
        
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration / 1000));
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + (duration / 1000));
    }

    function pressNote(noteNum) {
        playTone(noteFrequencies[noteNum]);
        
        let btn = document.getElementById(`note-${noteNum}`);
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 200);

        userSequence.push(noteNum);

        if (userSequence.length === correctSequence.length) {
            let matches = userSequence.every((val, idx) => val === correctSequence[idx]);
            let resBox = document.getElementById('result-box');
            resBox.style.display = 'block';
            if (matches) {
                resBox.style.color = '#34d399';
                resBox.innerHTML = `SUCCESS! The Royal Melody resonates! Select it below to view coordinates.`;
            } else {
                resBox.style.color = '#f87171';
                resBox.innerHTML = `DISCORDANT NOTE! The music box jams. Try again!`;
                userSequence = [];
            }
        }
    }

    // Auto-play sequence matching buttons 4, 5, 6, 4, 5, 6 exactly
    const lullabyNotes = [
        {freq: 493.88, dur: 400}, // Note 4 (B4)
        {freq: 587.33, dur: 400}, // Note 5 (D5)
        {freq: 880.00, dur: 800}, // Note 6 (A5)
        {freq: 493.88, dur: 400}, // Note 4 (B4)
        {freq: 587.33, dur: 400}, // Note 5 (D5)
        {freq: 880.00, dur: 800}  // Note 6 (A5)
    ];

    function playCylinderMelody() {
        initAudio();
        let delay = 0;
        lullabyNotes.forEach((item) => {
            setTimeout(() => {
                playTone(item.freq, item.dur);
            }, delay);
            delay += item.dur + 100;
        });
    }

    function resetCipher() {
        userSequence = [];
        let resBox = document.getElementById('result-box');
        resBox.style.display = 'none';
        document.getElementById('melody-select').value = "";
    }

    function checkDropdown(val) {
        let resBox = document.getElementById('result-box');
        resBox.style.display = 'block';
        if (val === 'lullaby') {
            resBox.style.color = '#34d399';
            resBox.innerHTML = `CORRECT MATCH: Zelda's Lullaby!<br>Coordinates: ${FINAL_COORDINATES}`;
        } else if (val !== "") {
            resBox.style.color = '#f87171';
            resBox.innerHTML = `INCORRECT MELODY. That tune opens nothing!`;
        } else {
            resBox.style.display = 'none';
        }
    }
</script>

</body>
</html>
